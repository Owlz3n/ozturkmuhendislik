<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Beyaz arka plan -->
  <rect width="64" height="64" rx="8" fill="#ffffff"/>
  
  <!-- Ana yaprak (koyu yeşil) - logo2.png'deki gibi -->
  <path d="M32 6 C24 12, 18 20, 20 30 C21 34, 24 37, 28 38 L32 38 L36 38 C40 37, 43 34, 44 30 C46 20, 40 12, 32 6Z" fill="#2d6a4f"/>
  
  <!-- İç yaprak detayı (açık yeşil) -->
  <path d="M32 10 C26 15, 22 22, 24 29 C25 32, 27 34, 30 35 L32 35 L34 35 C37 34, 39 32, 40 29 C42 22, 38 15, 32 10Z" fill="#52b788"/>
  
  <!-- Yaprak orta damarı -->
  <line x1="32" y1="12" x2="32" y2="36" stroke="#1b4332" stroke-width="1.2" stroke-linecap="round"/>
  
  <!-- ÖZTÜRK yazısı - kalın ve belirgin -->
  <text x="32" y="52" text-anchor="middle" font-family="Arial Black,Arial,Helvetica,sans-serif" font-weight="900" font-size="11" fill="#1b4332" letter-spacing="0.5">ÖZTÜRK</text>
  
  <!-- Alt çizgi -->
  <line x1="12" y1="55" x2="52" y2="55" stroke="#52b788" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Alt yazı küçük -->
  <text x="32" y="62" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="5" fill="#6b9080">ORMAN MÜH.</text>
</svg>
